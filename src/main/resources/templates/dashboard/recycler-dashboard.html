<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recycler Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="logo"><h2>♻️ EcoRecycle</h2></div>
        <ul class="nav-links">
            <li><a th:href="@{/}">Home</a></li>
            <li><a th:href="@{/logout}">Logout</a></li>
        </ul>
    </div>
</nav>
<section class="about-section">
    <div class="container">
        <h1 th:text="'Welcome, ' + ${username}">Welcome</h1>
        <p>Your role: Recycler</p>
        <div class="cta-section">
            <a th:href="@{/recyclers/{id}/pickups(id=${recyclerId})}" class="btn btn-primary">My Pickups</a>
            <a th:href="@{/recyclers/{id}/pickups/pending(id=${recyclerId})}" class="btn btn-secondary" style="margin-left:0.5rem;">Pending Requests</a>
        </div>
    </div>
</section>
</body>
</html>
