<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EcoRecycle</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-green: #28a745;
            --dark-green: #1e7e34;
            --light-green: #d4edda;
            --success-green: #20c997;
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
        }

        .dashboard-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 25px 20px;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            color: white;
        }

        .sidebar-header h2 {
            font-size: 24px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header p {
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
        }

        .sidebar-menu {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            color: #333;
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .menu-item:hover {
            background: var(--light-green);
            border-left-color: var(--primary-green);
            color: var(--dark-green);
        }

        .menu-item.active {
            background: var(--light-green);
            border-left-color: var(--primary-green);
            color: var(--primary-green);
            font-weight: 600;
        }

        .menu-item i {
            margin-right: 15px;
            font-size: 20px;
            width: 24px;
        }

        .logout-btn {
            margin: 20px;
            padding: 12px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .content-header {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 4px solid var(--primary-green);
        }

        .content-header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .content-header p {
            color: #666;
            font-size: 16px;
            margin: 0;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border-top: 3px solid transparent;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .stat-card.green { border-top-color: var(--primary-green); }
        .stat-card.blue { border-top-color: #0d6efd; }
        .stat-card.orange { border-top-color: #fd7e14; }
        .stat-card.teal { border-top-color: var(--success-green); }

        .stat-card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 15px;
        }

        .stat-icon.green { background: var(--light-green); color: var(--primary-green); }
        .stat-icon.blue { background: #cfe2ff; color: #0d6efd; }
        .stat-icon.orange { background: #fff3cd; color: #fd7e14; }
        .stat-icon.teal { background: #d1f4ea; color: var(--success-green); }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            font-weight: 500;
            margin: 0;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin: 10px 0;
        }

        .stat-change {
            font-size: 14px;
            color: var(--primary-green);
        }

        .stat-change.neutral {
            color: #6c757d;
        }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .action-btn {
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
        }

        .action-btn.danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-header h2 span, .sidebar-header p, .menu-item span { display: none; }
            .main-content { margin-left: 70px; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="bi bi-shield-check"></i> <span>EcoRecycle</span></h2>
            <p th:text="${username}">Admin</p>
        </div>

        <nav class="sidebar-menu">
            <a th:href="@{'/' + ${username} + '/dashboard'}" class="menu-item active">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" class="menu-item">
                <i class="bi bi-people"></i>
                <span>Users</span>
            </a>
            <a href="#" class="menu-item">
                <i class="bi bi-building"></i>
                <span>Businesses</span>
            </a>
            <a href="#" class="menu-item">
                <i class="bi bi-recycle"></i>
                <span>Recyclers</span>
            </a>
            <a href="#" class="menu-item">
                <i class="bi bi-graph-up"></i>
                <span>Reports</span>
            </a>
            <a href="#" class="menu-item">
                <i class="bi bi-gear"></i>
                <span>Settings</span>
            </a>
        </nav>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <div class="content-header">
            <h1>🔧 Admin Dashboard</h1>
            <p>System overview and management controls</p>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card green">
                <div class="stat-card-header">
                    <div class="stat-icon green">
                        <i class="bi bi-people-fill"></i>
                    </div>
                    <h3>Total Users</h3>
                </div>
                <div class="stat-value">0</div>
                <div class="stat-change">Registered users</div>
            </div>

            <div class="stat-card blue">
                <div class="stat-card-header">
                    <div class="stat-icon blue">
                        <i class="bi bi-building"></i>
                    </div>
                    <h3>Active Businesses</h3>
                </div>
                <div class="stat-value">0</div>
                <div class="stat-change neutral">Business partners</div>
            </div>

            <div class="stat-card orange">
                <div class="stat-card-header">
                    <div class="stat-icon orange">
                        <i class="bi bi-recycle"></i>
                    </div>
                    <h3>Recycling Centers</h3>
                </div>
                <div class="stat-value">0</div>
                <div class="stat-change neutral">Active centers</div>
            </div>

            <div class="stat-card teal">
                <div class="stat-card-header">
                    <div class="stat-icon teal">
                        <i class="bi bi-graph-up-arrow"></i>
                    </div>
                    <h3>Total Pickups</h3>
                </div>
                <div class="stat-value">0</div>
                <div class="stat-change">This month</div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="action-btn primary">
                <i class="bi bi-person-plus"></i> Manage Users
            </button>
            <button class="action-btn primary">
                <i class="bi bi-graph-up"></i> View Reports
            </button>
            <button class="action-btn danger">
                <i class="bi bi-exclamation-triangle"></i> System Status
            </button>
        </div>
    </main>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
