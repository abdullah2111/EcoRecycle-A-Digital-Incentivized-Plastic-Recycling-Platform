<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - EcoRecycle</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .registration-container {
            max-width: 650px;
            margin: 2rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-header h1 {
            color: #2c5f2d;
            margin-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        .form-group label .required {
            color: #e74c3c;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2c5f2d;
            box-shadow: 0 0 0 3px rgba(44, 95, 45, 0.1);
        }
        .user-type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .user-type-card {
            padding: 1.5rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .user-type-card:hover {
            border-color: #2c5f2d;
        }
        .user-type-card.selected {
            border-color: #2c5f2d;
            background-color: #f0f8f0;
        }
        .user-type-card input[type="radio"] {
            display: none;
        }
        .user-type-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .user-type-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }
        .section-divider {
            height: 1px;
            background: #eee;
            margin: 2rem 0;
        }
        .section-title {
            color: #2c5f2d;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #2c5f2d;
        }
        .hidden {
            display: none;
        }
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background-color: #2c5f2d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #1a3a1a;
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }
        .login-link a {
            color: #2c5f2d;
            font-weight: 600;
            text-decoration: none;
        }
        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="logo"><h2>♻️ EcoRecycle</h2></div>
        <ul class="nav-links">
            <li><a th:href="@{/}">Home</a></li>
            <li><a th:href="@{/about}">About</a></li>
            <li><a th:href="@{/login}">Login</a></li>
        </ul>
    </div>
</nav>

<section class="about-section">
    <div class="registration-container">
        <div class="form-header">
            <h1>Create Your Account</h1>
            <p>Register as a user to start recycling</p>
        </div>

        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <!-- Step 1: User Type Selection (At the Top) -->
            <div class="section-title">👤 Select Your User Type</div>

            <div class="user-type-selector">
                <div class="user-type-card" onclick="selectUserType('ROLE_HOUSEHOLD', this)">
                    <input type="radio" th:field="*{role}" value="ROLE_HOUSEHOLD" id="household" required onchange="toggleFields()">
                    <div class="user-type-icon">🏠</div>
                    <div class="user-type-label">Household</div>
                </div>
                <div class="user-type-card" onclick="selectUserType('ROLE_BUSINESS', this)">
                    <input type="radio" th:field="*{role}" value="ROLE_BUSINESS" id="business" required onchange="toggleFields()">
                    <div class="user-type-icon">🏢</div>
                    <div class="user-type-label">Business</div>
                </div>
            </div>
            <div th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="error-message"></div>

            <div class="section-divider"></div>

            <!-- Step 2: General Credentials -->
            <div class="section-title">📋 General Information</div>

            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" th:field="*{name}" required>
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Username <span class="required">*</span></label>
                <input type="text" th:field="*{username}" required>
                <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" th:field="*{email}" required>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" th:field="*{password}" required>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <input type="password" th:field="*{confirmPassword}" required>
                <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="error-message"></div>
            </div>

            <div class="section-divider"></div>

            <!-- Step 3: Contact Information (Common) -->
            <div class="section-title">📞 Contact Information</div>

            <div class="form-group">
                <label>Phone Number <span class="required">*</span></label>
                <input type="tel" th:field="*{phone}" required>
                <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error-message"></div>
            </div>

            <!-- Household-specific fields -->
            <div id="householdFields" class="hidden">
                <div class="section-divider"></div>
                <div class="section-title">👤 Gender</div>

                <div class="form-group">
                    <label>Gender</label>
                    <select th:field="*{gender}">
                        <option value="">-- Select Gender --</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
            </div>

            <div class="section-divider"></div>
            <div class="section-title">📍 Address</div>

            <div class="form-group">
                <label>District <span class="required">*</span></label>
                <input type="text" th:field="*{district}" required placeholder="e.g., Dhaka, Chittagong">
                <div th:if="${#fields.hasErrors('district')}" th:errors="*{district}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Thana/Upazilla <span class="required">*</span></label>
                <input type="text" th:field="*{thana}" required placeholder="e.g., Dhanmondi, Mirpur">
                <div th:if="${#fields.hasErrors('thana')}" th:errors="*{thana}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Area <span class="required">*</span></label>
                <input type="text" th:field="*{area}" required placeholder="e.g., Residential Area, Block, Zone">
                <div th:if="${#fields.hasErrors('area')}" th:errors="*{area}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Road, House/Flat Number <span class="required">*</span></label>
                <input type="text" th:field="*{addressLine}" required placeholder="e.g., Road 5, House 123 or Flat 4B">
                <div th:if="${#fields.hasErrors('addressLine')}" th:errors="*{addressLine}" class="error-message"></div>
            </div>

            <!-- Business-specific fields -->
            <div id="businessFields" class="hidden">
                <div class="section-divider"></div>
                <div class="section-title">🏢 Business Details</div>

                <div class="form-group">
                    <label>Business Name <span class="required">*</span></label>
                    <input type="text" th:field="*{businessName}">
                </div>

                <div class="form-group">
                    <label>Business Type</label>
                    <input type="text" th:field="*{businessType}" placeholder="e.g., Restaurant, Retail, Office">
                </div>

                <div class="form-group">
                    <label>Business Registration Number</label>
                    <input type="text" th:field="*{businessRegistrationNumber}">
                </div>

                <div class="form-group">
                    <label>Tax ID</label>
                    <input type="text" th:field="*{taxId}">
                </div>
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>

        <div class="login-link">
            <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
        </div>
    </div>
</section>

<script>
function selectUserType(type, element) {
    const radio = element.querySelector('input[type="radio"]');
    radio.checked = true;
    updateSelection();
    toggleFields();
}

function updateSelection() {
    const household = document.getElementById('household');
    const business = document.getElementById('business');

    document.querySelectorAll('.user-type-card').forEach(card => {
        card.classList.remove('selected');
    });

    if (household.checked) {
        household.closest('.user-type-card').classList.add('selected');
    } else if (business.checked) {
        business.closest('.user-type-card').classList.add('selected');
    }
}

function toggleFields() {
    const household = document.getElementById('household');
    const business = document.getElementById('business');
    const householdFields = document.getElementById('householdFields');
    const businessFields = document.getElementById('businessFields');

    householdFields.classList.add('hidden');
    businessFields.classList.add('hidden');

    if (household.checked) {
        householdFields.classList.remove('hidden');
    } else if (business.checked) {
        businessFields.classList.remove('hidden');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    updateSelection();
    toggleFields();
});
</script>
</body>
</html>
