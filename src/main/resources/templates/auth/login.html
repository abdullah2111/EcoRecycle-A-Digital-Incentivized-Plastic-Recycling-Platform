<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - EcoRecycle</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="logo"><h2>♻️ EcoRecycle</h2></div>
        <ul class="nav-links">
            <li><a th:href="@{/}">Home</a></li>
            <li><a th:href="@{/about}">About</a></li>
        </ul>
    </div>
</nav>

<section class="about-section">
    <div class="container">
        <h1>Login</h1>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${param.error}" class="alert error">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert success">You have been logged out.</div>

        <form th:action="@{/login}" method="post">
            <div>
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div>
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>

        <div style="text-align:center;margin-top:1rem;">
            <p>New here?</p>
            <a th:href="@{/users/register}" class="btn btn-primary">Register as User</a>
            <a th:href="@{/recyclers/register}" class="btn btn-secondary" style="margin-left:0.5rem;">Register as Recycler</a>
        </div>
    </div>
</section>
</body>
</html>
