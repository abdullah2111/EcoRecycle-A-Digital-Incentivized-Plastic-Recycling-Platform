<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoRecycle</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .login-container {
            max-width: 450px;
            margin: 3rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: #2c5f2d;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: #666;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2c5f2d;
            box-shadow: 0 0 0 3px rgba(44, 95, 45, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 1rem;
            background-color: #2c5f2d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-login:hover {
            background-color: #1a3a1a;
        }
        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #eee;
        }
        .divider span {
            background: white;
            padding: 0 1rem;
            position: relative;
            color: #999;
            font-size: 0.9rem;
        }
        .register-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .register-link {
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            color: #2c5f2d;
            font-weight: 600;
            transition: all 0.3s;
        }
        .register-link:hover {
            border-color: #2c5f2d;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="logo"><h2>♻️ EcoRecycle</h2></div>
        <ul class="nav-links">
            <li><a th:href="@{/}">Home</a></li>
            <li><a th:href="@{/about}">About</a></li>
        </ul>
    </div>
</nav>

<section class="about-section">
    <div class="login-container">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Login to your EcoRecycle account</p>
        </div>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${param.error}" class="alert error">Invalid username or password</div>
        <div th:if="${param.logout}" class="alert success">You have been logged out successfully</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" name="username" required placeholder="Enter your username or email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="divider">
            <span>Don't have an account?</span>
        </div>

        <div class="register-links">
            <a th:href="@{/register}" class="register-link">
                🏠 Register as User
            </a>
            <a th:href="@{/register/recycler}" class="register-link">
                ♻️ Register as Recycler
            </a>
        </div>
    </div>
</section>
</body>
</html>
